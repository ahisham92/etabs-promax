name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build CsiProMax.sln -c Release
      - run: dotnet run -c Release --no-build --project tests/CsiProMax.Tests
      # The one-line install (install.ps1), on a made-up package and made-up settings files.
      - run: pwsh -NoProfile -File tests/install.Tests.ps1
      # The one-line check (check.ps1): each version of each program creates its plug-in, and the plug-in of 0.4.4 cannot be.
      - run: pwsh -NoProfile -File tests/check.Tests.ps1
  windows:
    # What only Windows can say. Windows PowerShell is the .NET Framework, which ETABS 18 to 21, SAFE 20 and 21 and
    # SAP2000 20 to 25 run on: here the plug-ins are created as those programs create them (0.4.4 could not be, and
    # nothing ran here to say so). Then the window is opened once, and a picture of it is kept with the run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build CsiProMax.sln -c Release
      # (The C# tests run in the core job: some of them stand in for Windows parts and are written for a machine without them.)
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/check.Tests.ps1
        shell: cmd
      - run: pwsh -NoProfile -File tests/install.Tests.ps1
        shell: cmd
      - run: dotnet publish src/CsiProMax.Assistant -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/window.Tests.ps1 -Folder "publish/CSI ProMax" -Picture window.png
        shell: cmd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window
          path: window.png
          if-no-files-found: ignore
  assistant:
    # The assistant and its ETABS plug-in as one folder of DLLs (no .exe), kept with the run so it can be tried.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/CsiProMax.Assistant -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: dotnet publish src/CsiProMax.Plugin -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: dotnet publish src/CsiProMax.Plugin.Safe -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: dotnet publish src/CsiProMax.Plugin.Sap -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: cp check.ps1 "publish/CSI ProMax/"
      - run: test ! -e "publish/CSI ProMax/ETABSv1.dll" && test ! -e "publish/CSI ProMax/SAFEv1.dll" && test -e "publish/CSI ProMax/CsiProMaxSafePlugin.dll" && test ! -e "publish/CSI ProMax/SAP2000v1.dll" && test -e "publish/CSI ProMax/CsiProMaxSapPlugin.dll" && ! ls "publish/CSI ProMax" | grep -i '\.exe$'
      - uses: actions/upload-artifact@v4
        with:
          name: CSI-ProMax
          path: publish
