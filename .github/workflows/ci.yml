name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build CsiProMax.sln -c Release
      - run: dotnet run -c Release --no-build --project tests/CsiProMax.Tests
  assistant:
    # The assistant and its ETABS plug-in as one folder of DLLs (no .exe), kept with the run so it can be tried.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish src/CsiProMax.Assistant -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: dotnet publish src/CsiProMax.Plugin -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: dotnet publish src/CsiProMax.Plugin.Sap -c Release -p:DebugType=none -o "publish/CSI ProMax"
      - run: test ! -e "publish/CSI ProMax/ETABSv1.dll" && test ! -e "publish/CSI ProMax/SAP2000v1.dll" && ! ls "publish/CSI ProMax" | grep -i '\.exe$'
      - uses: actions/upload-artifact@v4
        with:
          name: CSI-ProMax
          path: publish
