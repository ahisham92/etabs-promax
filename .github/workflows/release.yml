name: Release
# Pushing a tag like v0.3.1 publishes the package the updater downloads: EtabsProMax-<version>.zip with a dist folder
# of DLLs (no .exe). The tag must match the version in the assistant's project file.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "<Version>$version</Version>" src/EtabsProMax.Assistant/EtabsProMax.Assistant.csproj || { echo "Tag $GITHUB_REF_NAME does not match the project's version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet run -c Release --project tests/EtabsProMax.Tests
      - run: dotnet publish src/EtabsProMax.Assistant -c Release -p:DebugType=none -o package/dist
      - run: dotnet publish src/EtabsProMax.Plugin -c Release -p:DebugType=none -o package/dist
      - run: test -e package/dist/EtabsProMax.dll && test ! -e package/dist/ETABSv1.dll && ! find package -iname '*.exe' | grep .
      - run: cp docs/INSTALL.txt package/ && cd package && zip -q -r "../EtabsProMax-$VERSION.zip" .
      - run: gh release create "$GITHUB_REF_NAME" "EtabsProMax-$VERSION.zip" --title "ETABS ProMax $VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
