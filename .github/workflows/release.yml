name: Release
# Pushing a tag like v0.3.1 publishes the package the updater downloads: CsiProMax-<version>.zip with a dist folder
# of DLLs (no .exe). The tag must match the version in the assistant's project file.
# A tag with a suffix, like v0.4.0-test1, publishes a pre-release: a download to hand out that the updater leaves alone.
# The same runs from the Actions page (Run workflow) with the tag typed in: the release then makes the tag itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, like v0.4.0 or v0.4.0-test1'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$TAG" in v[0-9]*) ;; *) echo "The tag must look like v0.4.0"; exit 1;; esac
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          tag="${TAG#v}"
          version="${tag%%-*}"
          if [ "$tag" != "$version" ]; then echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"; echo "NAME=$tag" >> "$GITHUB_ENV"; else echo "NAME=$version" >> "$GITHUB_ENV"; fi
          grep -q "<Version>$version</Version>" src/CsiProMax.Assistant/CsiProMax.Assistant.csproj || { echo "Tag $TAG does not match the project's version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet run -c Release --project tests/CsiProMax.Tests
      - run: dotnet publish src/CsiProMax.Assistant -c Release -p:DebugType=none -o package/dist
      - run: dotnet publish src/CsiProMax.Plugin -c Release -p:DebugType=none -o package/dist
      - run: dotnet publish src/CsiProMax.Plugin.Safe -c Release -p:DebugType=none -o package/dist
      - run: dotnet publish src/CsiProMax.Plugin.Sap -c Release -p:DebugType=none -o package/dist
      - run: test -e package/dist/CsiProMax.dll && test -e package/dist/CsiProMaxPlugin.dll && test -e package/dist/CsiProMaxSafePlugin.dll && test -e package/dist/CsiProMaxSapPlugin.dll
      - run: test -e package/dist/CDT.Core.dll && test -e package/dist/CDT.Wpf.dll && test -e package/dist/WpfMath.dll && test -e package/dist/XamlMath.Shared.dll
      - run: test ! -e package/dist/ETABSv1.dll && test ! -e package/dist/SAFEv1.dll && test ! -e package/dist/SAP2000v1.dll && ! find package -iname '*.exe' | grep .
      - run: pwsh -NoProfile -File tests/install.Tests.ps1
      - run: pwsh -NoProfile -File tests/check.Tests.ps1
      # The check goes into the package (the installer and the field test run it) and beside it as a file of its own.
      - run: cp check.ps1 package/dist/
      - run: cp docs/INSTALL.txt package/ && cd package && zip -q -r "../CsiProMax-$NAME.zip" .
      # What an update downloads instead of the whole package: the file list, and a zip of only the files that differ
      # from the latest release (scripts/changed-files.py). Its name must not start with CsiProMax-: older updaters take
      # the first such zip as the whole package. With no earlier release every file counts as changed.
      - name: Changed files
        run: |
          mkdir -p previous
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'CsiProMax-*.zip' --dir previous 2>/dev/null; then
            for z in previous/CsiProMax-*.zip; do unzip -q -o "$z" -d previous/unpacked; done
          fi
          python3 scripts/changed-files.py package/dist "previous/unpacked/dist" files.json "changed-$NAME.zip"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh release create "$TAG" "CsiProMax-$NAME.zip" "changed-$NAME.zip" files.json install.ps1 check.ps1 --target "$GITHUB_SHA" --title "CSI ProMax $NAME" --generate-notes $PRERELEASE
        env:
          GH_TOKEN: ${{ github.token }}
