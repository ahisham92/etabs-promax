<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ETABS ProMax</title>
<style>
  /* Sketch ProMax's palette (UI/Brand.cs), light and dark. */
  :root {
    --bg:#FFFFFF; --canvas:#F8FAFC; --surface:#F1F5F9; --raised:#FFFFFF; --border:#CBD5E1; --border-subtle:#E2E8F0;
    --text:#0F172A; --muted:#475569; --accent:#1D4ED8; --accent-hover:#1E40AF; --on-accent:#FFFFFF; --accent-soft:#E8EFFD;
    --danger:#B91C1C; --danger-text:#B91C1C; --success-text:#15803D; --notice-bg:#FFF7E0; --notice-border:#D97706;
    --field:#F8FAFC; --input-border:#64748B; --focus:#1D4ED8; --header-sub:#E0E7FF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#2B2F36; --canvas:#2B2F36; --surface:#353A42; --raised:#32373F; --border:#4B525C; --border-subtle:#434A54;
      --text:#ECEFF3; --muted:#B4BCC8; --accent:#2563EB; --accent-hover:#1D4ED8; --accent-soft:#2C3B5A;
      --danger:#C62828; --danger-text:#FF9A92; --success-text:#6EDC9A; --notice-bg:#3A3220; --notice-border:#B7791F;
      --field:#23272D; --input-border:#8A93A0; --focus:#93B4FF;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--canvas); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--accent); color: #fff; padding: 10px 14px; display: flex; align-items: center; gap: 10px; }
  header .title { font-weight: 600; font-size: 15px; }
  header .sub { color: var(--header-sub); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .grow { flex: 1; min-width: 0; }
  header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.55); border-radius: 14px; padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  header button:hover { background: rgba(255,255,255,.15); }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 100%; padding: 9px 12px; border-radius: 12px; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--accent-soft); max-width: 88%; white-space: pre-wrap; }
  .msg.assistant { background: var(--raised); border: 1px solid var(--border-subtle); }
  .msg.error { background: var(--notice-bg); border: 1px solid var(--notice-border); }
  .msg p { margin: 0 0 8px; } .msg p:last-child, .msg ul:last-child, .msg ol:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 0 0 8px; padding-left: 20px; }
  .msg code { background: var(--surface); border-radius: 4px; padding: 0 4px; font-family: Consolas, monospace; font-size: 13px; }
  .msg pre { background: var(--surface); border-radius: 8px; padding: 8px; overflow-x: auto; margin: 0 0 8px; }
  .msg pre code { background: none; padding: 0; }
  .msg table { border-collapse: collapse; font-size: 13px; margin: 0 0 8px; display: block; overflow-x: auto; }
  .msg th, .msg td { border: 1px solid var(--border); padding: 3px 8px; text-align: left; }
  .msg th { background: var(--surface); }
  .msg h1, .msg h2, .msg h3 { font-size: 14px; margin: 4px 0 6px; }
  .activity { color: var(--muted); font-size: 12px; padding: 0 4px; }
  .card { background: var(--raised); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 14px; }
  .card p { margin: 0 0 10px; color: var(--muted); }
  .card .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button.primary, button.plain, button.danger { font: inherit; border-radius: 14px; padding: 5px 16px; cursor: pointer; border: 1px solid transparent; }
  button.primary { background: var(--accent); color: var(--on-accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.plain { background: var(--surface); color: var(--text); border-color: var(--border-subtle); }
  button.plain:hover { border-color: var(--border); }
  button.danger { background: var(--danger); color: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  footer { padding: 10px 14px 12px; background: var(--bg); border-top: 1px solid var(--border-subtle); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 40px; max-height: 160px; background: var(--field); color: var(--text); border: 1px solid var(--input-border); border-radius: 12px; padding: 9px 12px; font: inherit; }
  .options { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .options .grow { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin: auto 0; padding: 20px; }
  .hint b { color: var(--text); display: block; font-size: 15px; margin-bottom: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .chips button { font: inherit; font-size: 12px; background: var(--raised); color: var(--text); border: 1px solid var(--border-subtle); border-radius: 14px; padding: 4px 12px; cursor: pointer; }
  .chips button:hover { border-color: var(--border); }
</style>
</head>
<body>
<header>
  <div class="grow">
    <div class="title">ETABS ProMax</div>
    <div class="sub" id="model">Looking for ETABS…</div>
  </div>
  <button id="new" title="Start a new chat">New chat</button>
</header>
<div id="log" aria-live="polite"></div>
<footer>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Ask about the model, or say what to do" aria-label="Message"></textarea>
    <button class="primary" id="send">Send</button>
  </div>
  <div class="options">
    <input type="checkbox" id="ask"><label for="ask">Ask me before every change to the model</label>
    <span class="grow"></span><span id="version"></span>
  </div>
</footer>
<script>
const key = new URLSearchParams(location.search).get('k') || '';
const log = document.getElementById('log'), input = document.getElementById('input'), send = document.getElementById('send');
let busy = false, live = null, liveText = '', activity = null, setup = null;

const api = (path, body) => fetch('/api/' + path, {
  method: body === undefined ? 'GET' : 'POST',
  headers: { 'X-EtabsProMax': key, 'Content-Type': 'application/json' },
  body: body === undefined ? undefined : JSON.stringify(body),
}).then(r => r.headers.get('content-type')?.includes('json') ? r.json() : null);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
function scroll() { log.scrollTop = log.scrollHeight; }
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function inline(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
}
// A small Markdown reader: paragraphs, lists, headings, code blocks and tables. Everything is escaped first.
function markdown(text) {
  const lines = text.split('\n'), out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (line.startsWith('```')) {
      const code = []; i++;
      while (i < lines.length && !lines[i].startsWith('```')) code.push(lines[i++]);
      i++; out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue;
    }
    if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => inline(c.trim()));
      let html = '<table><tr>' + cells(line).map(c => '<th>' + c + '</th>').join('') + '</tr>'; i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) html += '<tr>' + cells(lines[i++]).map(c => '<td>' + c + '</td>').join('') + '</tr>';
      out.push(html + '</table>'); continue;
    }
    const heading = /^(#{1,3})\s+(.*)$/.exec(line);
    if (heading) { out.push('<h3>' + inline(heading[2]) + '</h3>'); i++; continue; }
    const item = /^\s*([-*]|\d+\.)\s+(.*)$/;
    if (item.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < lines.length && item.test(lines[i])) items.push('<li>' + inline(item.exec(lines[i++])[2]) + '</li>');
      out.push((ordered ? '<ol>' : '<ul>') + items.join('') + (ordered ? '</ol>' : '</ul>')); continue;
    }
    if (line.trim() === '') { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() !== '' && !lines[i].startsWith('```') && !item.test(lines[i]) && !/^#{1,3}\s/.test(lines[i])) para.push(lines[i++]);
    out.push('<p>' + para.map(inline).join('<br>') + '</p>');
  }
  return out.join('');
}

function add(role, text) {
  clearHint();
  const m = el('div', 'msg ' + role);
  if (role === 'user') m.textContent = text; else m.innerHTML = markdown(text);
  log.appendChild(m); scroll(); return m;
}
function setBusy(value) {
  busy = value;
  send.textContent = busy ? 'Stop' : 'Send';
  send.className = busy ? 'danger' : 'primary';
  if (!busy && activity) { activity.remove(); activity = null; }
}
function note(text) {
  if (!activity) { activity = el('div', 'activity'); log.appendChild(activity); }
  else log.appendChild(activity);
  activity.textContent = text; scroll();
}
const words = {
  get_model_context: 'Reading the model', query_objects: 'Looking at the objects', select_objects: 'Selecting in ETABS', list_tables: 'Finding the table',
  read_table: 'Reading a table from ETABS', add_columns: 'Adding columns', add_beams: 'Adding beams', add_slabs: 'Adding slabs', add_walls: 'Adding walls',
  set_section: 'Changing sections', set_supports: 'Setting supports', add_load_pattern: 'Adding a load pattern', set_loads: 'Putting on loads',
  add_combination: 'Adding a combination', delete_objects: 'Deleting', run_analysis: 'Running the analysis', save_model: 'Saving the model',
};

function clearHint() { document.getElementById('hint')?.remove(); }
function hint() {
  if (log.children.length) return;
  const h = el('div', 'hint'); h.id = 'hint';
  h.innerHTML = '<b>What do you need in this model?</b>Ask a question or say what to change. ETABS stays yours: nothing is deleted, saved or run without your yes.';
  const chips = el('div', 'chips');
  for (const text of ['What is in this model?', 'Which sections do the columns use?', 'Show the story drifts', 'List the base reactions for Dead']) {
    const b = el('button', '', text); b.onclick = () => { input.value = text; submit(); }; chips.appendChild(b);
  }
  h.appendChild(chips); log.appendChild(h);
}

function showSetup(state) {
  setup?.remove(); setup = null;
  if (state.claude === 'ready') return;
  clearHint();
  setup = el('div', 'card');
  const missing = state.claude === 'missing';
  setup.appendChild(el('h3', '', missing ? 'Claude Code is needed for the chat' : 'Sign in to Claude'));
  setup.appendChild(el('p', '', missing
    ? 'The chat runs on Claude Code, on your own Claude plan. A window opens and runs Anthropic\'s official installer; it takes about a minute.'
    : 'A window opens and your browser asks you to sign in with your Claude account. Come back here when it says you are signed in.'));
  const row = el('div', 'row');
  const go = el('button', 'primary', missing ? 'Install Claude Code' : 'Sign in');
  go.onclick = () => api(missing ? 'claude/install' : 'claude/signin', {});
  const again = el('button', 'plain', 'I have done it');
  again.onclick = async () => { again.disabled = true; showState(await api('claude/check', {})); };
  row.append(go, again); setup.appendChild(row); log.prepend(setup);
}

function showState(state) {
  const m = state.model || {};
  document.getElementById('model').textContent = m.error ? m.error : `${m.file}  ·  ETABS ${m.etabs}  ·  ${m.units}${m.locked ? '  ·  locked' : ''}`;
  document.getElementById('ask').checked = !!state.askBeforeChanges;
  document.getElementById('version').textContent = state.version ? 'v' + state.version : '';
  showSetup(state);
}

function approval(ev) {
  clearHint();
  const card = el('div', 'card'); card.dataset.id = ev.id;
  card.appendChild(el('h3', '', 'Allow this in ETABS?'));
  card.appendChild(el('p', '', ev.summary + '.'));
  const row = el('div', 'row');
  const yes = el('button', 'primary', 'Allow'), no = el('button', 'plain', "Don't");
  const answer = allow => { yes.disabled = no.disabled = true; api('approve', { id: ev.id, allow }); };
  yes.onclick = () => answer(true); no.onclick = () => answer(false);
  row.append(yes, no); card.appendChild(row); log.appendChild(card); scroll(); yes.focus();
}

function onEvent(ev) {
  switch (ev.type) {
    case 'user': add('user', ev.text); setBusy(true); note('Thinking…'); break;
    case 'break': live = null; liveText = ''; break;
    case 'text':
      if (!live) { live = add('assistant', ''); liveText = ''; }
      liveText += ev.text; live.innerHTML = markdown(liveText);
      if (activity) log.appendChild(activity);
      scroll(); break;
    case 'tool': note((words[ev.name] || ev.name) + (ev.ok ? '…' : ' did not work, trying another way…')); break;
    case 'approval': approval(ev); break;
    case 'approval-closed': log.querySelector(`.card[data-id="${ev.id}"]`)?.remove(); break;
    case 'notice': add('error', ev.text); break;
    case 'done':
      if (ev.failed) add('error', ev.text || 'Something went wrong.');
      else if (!live && ev.text) add('assistant', ev.text);
      live = null; liveText = ''; setBusy(false); refresh(); break;
    case 'reset': log.innerHTML = ''; live = null; setBusy(false); hint(); break;
  }
}

async function submit() {
  if (busy) { api('stop', {}); return; }
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; input.style.height = 'auto';
  const r = await api('send', { text });
  if (r && r.error) add('error', r.error);
}
send.onclick = submit;
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(160, input.scrollHeight) + 'px'; });
document.getElementById('new').onclick = () => api('new', {});
document.getElementById('ask').onchange = e => api('settings', { askBeforeChanges: e.target.checked });

async function refresh() { showState(await api('state')); }
(async () => {
  const state = await api('state');
  for (const h of state.history) add(h.role, h.text);
  setBusy(!!state.busy); showState(state); hint();
  const events = new EventSource('/api/events?k=' + encodeURIComponent(key));
  events.onmessage = e => onEvent(JSON.parse(e.data));
  setInterval(refresh, 15000);
  input.focus();
})();
</script>
</body>
</html>
